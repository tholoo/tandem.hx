[package]
name = "tandem"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Human-controlled implementation proposals inside Helix"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
