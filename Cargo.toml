[package]
name = "tandem"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Guided code tours and reviewable AI edits inside Helix"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tholoo/tandem.hx"
keywords = ["helix", "ai", "code-review", "tours"]
categories = ["development-tools"]
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1.1"

[profile.release]
lto = "thin"
strip = true
